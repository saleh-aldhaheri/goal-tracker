name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, zip, curl, xml, dom, fileinfo, openssl, ctype, tokenizer, json, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run tests
        id: run_tests
        run: php artisan test 2>&1 | tee test-output.txt
        continue-on-error: true

      - name: Report failure as a commit comment
        if: steps.run_tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request

          with open('test-output.txt', 'r', errors='replace') as f:
              output = f.read()[-60000:]

          payload = json.dumps({'body': '### CI test output\n\n```\n' + output + '\n```'}).encode()
          url = f"https://api.github.com/repos/{os.environ['REPO']}/commits/{os.environ['SHA']}/comments"
          req = urllib.request.Request(url, data=payload, method='POST', headers={
              'Authorization': f"token {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
          })
          urllib.request.urlopen(req)
          PYEOF

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
